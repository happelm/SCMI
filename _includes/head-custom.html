<style>
  .markdown-body pre, .markdown-body .highlight { position: relative; }
  .copy-btn { position: absolute; top: 6px; right: 6px; font: 12px -apple-system, "Segoe UI", sans-serif;
    padding: 2px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: #0969da; cursor: pointer; }
  .copy-btn:hover { background: #f3f4f6; }
  .markdown-body blockquote { border-left-color: #0078d4; background: #eff6fc; color: #242424; padding: 8px 16px; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('div.highlighter-rouge, pre:not(.highlight)').forEach(function (block) {
    if (block.closest('div.highlighter-rouge') && block.tagName === 'PRE') return;
    var code = block.querySelector('code') || block;
    var btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.type = 'button'; btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(code.innerText.replace(/\n$/, '')).then(function () {
        btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
      });
    });
    block.style.position = 'relative';
    block.appendChild(btn);
  });
});
</script>
